version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: kumpe3d-backend
    environment:
      # Database (SQLite for development)
      DATABASE_URL: sqlite+aiosqlite:///./data/kumpe3d.db
      DB_ECHO: ${DB_ECHO:-true}
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      
      # CORS
      CORS_ORIGINS: http://localhost:4200,http://localhost:3000
      
      # App
      APP_ENV: development
      LOG_LEVEL: INFO
      

    volumes:
      - ./backend:/app
      - sqlite_data:/app/data
    ports:
      - "8000:8000"
    networks:
      - kumpe3d-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: kumpe3d-frontend
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks:
      - kumpe3d-network

volumes:
  sqlite_data:

networks:
  kumpe3d-network:
    driver: bridge
